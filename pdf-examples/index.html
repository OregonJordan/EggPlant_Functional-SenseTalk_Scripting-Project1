<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Examples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .pdf-button {
      display: inline-block;
      background-color: #ff7a00;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin: 10px 0;
    }

    .pdf-button:hover {
      background-color: #e56c00;
    }
  </style>
</head>
<body>

  <h2>PDF Examples</h2>

  <a class="pdf-button" href="All%20Script.pdf" target="_blank">
    View “All Script.pdf”
  </a>

</body>
</html>
