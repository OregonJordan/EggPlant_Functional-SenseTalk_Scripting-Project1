<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Examples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .pdf-button {
      display: inline-block;
      background-color: #ff7a00;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin: 10px 0;
    }

    .pdf-button:hover {
      background-color: #e56c00;
    }
  </style>
</head>
<body>

  <h2>PDF Examples</h2>
  <div id="pdf-list"></div>

  <script>
    // List all PDF files manually here
    // GitHub Pages cannot auto-read directories, so we define the list:
    const pdfFiles = [
      "All Script.pdf",
      // Add more PDFs here as you upload them:
      // "Example2.pdf",
      // "AnotherScript.pdf"
    ];

    const container = document.getElementById("pdf-list");

    pdfFiles.forEach(file => {
      const encoded = encodeURIComponent(file);
      const link = document.createElement("a");
      link.href = encoded;
      link.textContent = file;
      link.className = "pdf-button";
      link.target = "_blank";
      container.appendChild(link);
    });
  </script>

</body>
</html>
